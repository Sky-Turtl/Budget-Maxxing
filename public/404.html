<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Budget-Maxxing</title>
    <script>
      // GitHub Pages SPA redirect shim: stash the requested path and bounce to the
      // app root, where the inline script in index.html restores it via history.replaceState.
      var basePath = '/Budget-Maxxing';
      var path = location.pathname.slice(basePath.length) + location.search + location.hash;
      sessionStorage.setItem('spa-redirect', path);
      location.replace(basePath + '/');
    </script>
  </head>
  <body></body>
</html>
